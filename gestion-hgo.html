<!DOCTYPE html>
<html lang="es" class="auth-pending">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Gestión · HondaGo</title>
    <link rel="icon" href="img/icon-192.png" />
    <script>
      try {
        var t = localStorage.getItem("hondago_tema") || (localStorage.getItem("modoOscuro") === "true" ? "oscuro" : "auto");
        if (t !== "auto") document.documentElement.setAttribute("data-theme", t === "oscuro" ? "dark" : "light");
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&display=block" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body class="page-admin">
    <div class="splash"><img src="img/icon-512.png" alt="HondaGo" /></div>

    <section id="login" class="login" hidden>
      <div class="login-card">
        <img src="img/logo-honda.webp" alt="Honda" class="login-logo" />
        <h1>Gestión HondaGo</h1>
        <p>Inicia sesión con tu cuenta de Google.</p>
        <button class="btn btn-primary btn-block" data-login><span class="ms">login</span> Entrar con Google</button>
        <p class="login-error" data-login-error></p>
      </div>
    </section>

    <div class="app">
      <header class="app-header app-header-nav">
        <a href="index.html" class="icon-btn" title="Volver a la app"><span class="ms">arrow_back</span></a>
        <h1>Gestión</h1>
        <span class="icon-btn" aria-hidden="true"></span>
      </header>

      <main class="main main-admin">
        <div class="card">
          <div class="card-row">
            <h3><span class="ms">request_quote</span> Financiamiento del mes</h3>
            <span class="tag" id="g-vig-tag"></span>
          </div>

          <label class="field-label" for="g-vigencia">Vigencia</label>
          <input type="month" id="g-vigencia" />

          <label class="field-label" for="g-oferta">Oferta comercial (link de Google Drive)</label>
          <div class="input-btn">
            <input type="url" id="g-oferta" placeholder="https://drive.google.com/file/d/…/view" />
            <button class="icon-btn" data-probar="g-oferta" title="Probar link"><span class="ms">open_in_new</span></button>
          </div>
          <p class="hint" id="g-oferta-act"></p>

          <label class="field-label" for="g-descuentos">Bonos e incentivos (link de Google Drive)</label>
          <div class="input-btn">
            <input type="url" id="g-descuentos" placeholder="https://drive.google.com/file/d/…/view" />
            <button class="icon-btn" data-probar="g-descuentos" title="Probar link"><span class="ms">open_in_new</span></button>
          </div>
          <p class="hint" id="g-descuentos-act"></p>

          <button class="btn btn-primary btn-block" id="g-guardar"><span class="ms">save</span> Guardar financiamiento</button>
        </div>

        <a class="row row-card" href="precios.html">
          <span class="ms row-icon row-icon-lg">sell</span>
          <span class="row-main"><strong>Precios y versiones</strong><small>Agregar año-modelo, versiones, precios y fichas técnicas</small></span>
          <span class="ms">chevron_right</span>
        </a>

        <p class="nota">Los cambios se ven en la app en segundos, sin tener que actualizarla.</p>
      </main>
    </div>

    <script type="module" src="js/gestion.js"></script>
  </body>
</html>
